[project]
name = "babata"
version = "0.1.0"
description = "Thin transport shell for babata channels and CPU adapters"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=22.0",
    "claude-agent-sdk>=0.2.87",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "aiohttp>=3.10",
    "cryptography>=42.0",
    "edge-tts>=6.1",        # MS Edge 免费 TTS, 中文 zh-CN-XiaoxiaoNeural 默认; ~150KB
]

[project.optional-dependencies]
stt-local = [
    "faster-whisper>=1.0",  # 显式 BABATA_STT_LOCAL=1 时才需要.
]

# WX channel: pilk = SILK voice decode (C ext, build 需要 gcc); qrcode = 终端 ASCII QR.
# TG-only 用户不装这俩, 避免 ARM/无 prebuilt wheel 场景 (e.g. Linux + Python 3.13) 卡 build.
# wizard.py step_wx 选 yes 时才 `uv sync --extra wx` 现装.
wx = [
    "pilk>=0.2.4",
    "qrcode>=7.4",
]

[project.scripts]
babata = "bot:main"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 单文件 module 项目 (没用 packages 目录), 显式列出每个 .py 让 setuptools
# 知道安装哪些. 没这段 uv sync 不会真 install 项目, [project.scripts] 不生成
# entry script, .venv/bin/babata 不存在, install.sh 的 symlink 变 dangling.
[tool.setuptools]
py-modules = [
    "blocking_review", "bot", "bridge", "cc", "cli_runtime", "codex_engine", "constants", "engine", "grok_engine", "media",
    "memory_runtime", "review_health",
    "tg_mcp", "tg_transcript", "weixin_account", "weixin_bot",
    "weixin_bridge", "weixin_ilink", "weixin_mcp",
    "sidebar_bot", "sidebar_bridge", "sidebar_events",
    "sidebar_history", "sidebar_mcp", "sidebar_tool_registry", "sidebar_translate",
    "telegraph", "tg_tool_format", "turn_audit",
]
